# The build list for the `eyelash_sofle` variant in this folder.
# Written by VileMK - read-only against your config repo.
#
# To use it: copy
#     eyelash_sofle_custom_3_notd.keymap
# into the config repo's `config/`, and this file over the repo's own
# `build.yaml`. Every entry names the keymap explicitly, so ZMK builds
# this one rather than whatever `config/<board>.keymap` happens to hold.
#
# Entries taken from the repo's own build.yaml,
# with the KEYMAP_FILE changed,
# plus the flags for the feature-gated behaviors the keymap
# binds - a bound behavior only works when its feature is
# compiled in.
---
include:
  - board: eyelash_sofle_left
    snippet: studio-rpc-usb-uart
    cmake-args: -DKEYMAP_FILE="${GITHUB_WORKSPACE}/config/eyelash_sofle_custom_3_notd.keymap" -DCONFIG_ZMK_RGB_UNDERGLOW=y -DCONFIG_WS2812_STRIP=y -DCONFIG_ZMK_PM_SOFT_OFF=y -DCONFIG_ZMK_POINTING=y -DCONFIG_ZMK_STUDIO=y
  - board: eyelash_sofle_right
    cmake-args: -DKEYMAP_FILE="${GITHUB_WORKSPACE}/config/eyelash_sofle_custom_3_notd.keymap" -DCONFIG_ZMK_RGB_UNDERGLOW=y -DCONFIG_WS2812_STRIP=y -DCONFIG_ZMK_PM_SOFT_OFF=y -DCONFIG_ZMK_POINTING=y
  # Added by hand: clears the keymap stored in the settings partition.
  # A ZMK Studio session (unlocked with `&studio_unlock`) writes edited key
  # positions to flash, and those override the compiled keymap on every boot.
  # The physical reset button and the bootloader do NOT clear them - only
  # flashing these two uf2 files does. Flash both halves, then flash the
  # normal firmware above and re-pair.
  - board: eyelash_sofle_left
    shield: settings_reset
  - board: eyelash_sofle_right
    shield: settings_reset
